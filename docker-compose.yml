services:
  reverse-proxy:
    build:
      context: ./reverse-proxy
    container_name: cloudpaste_reverse_proxy
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    networks:
      - pastenet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cloudpaste_frontend
    expose:
      - "80"
    networks:
      - pastenet
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: cloudpaste_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pastenet
      - dbnet
    restart: always
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  db:
    build:
      context: ./database
    container_name: cloudpaste_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  pastenet:
    name: pastenet
    driver: bridge
  dbnet:
    name: cloudpaste_dbnet
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: cloudpaste_postgres_data
