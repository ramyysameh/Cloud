server {
    listen 80;
    server_name _;

    # Allow reasonably large notes and code snippets without making uploads unbounded.
    client_max_body_size 5m;

    # Normalize /api to /api/ so the prefix-stripping location below is always used.
    location = /api {
        return 308 /api/;
    }

    # Strip /api/ before forwarding, so /api/health becomes /health in Express.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the static frontend SPA served by its own Nginx container.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}